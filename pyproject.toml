[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiam-sdk"
version = "1.0.0a39"
description = "Official Python client SDK for AXIAM IAM"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["axiam", "iam", "auth", "authentication", "authorization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "grpcio>=1.78,<1.84",
    # `grpcio` does NOT depend on `protobuf` — they are separate distributions —
    # so without this line `import axiam_sdk.grpc` fails on a clean install with
    # `ModuleNotFoundError: No module named 'google'`. The generated `_pb2`
    # modules import `google.protobuf` and call
    # `_runtime_version.ValidateProtobufRuntimeVersion`, which enforces the
    # gencode version at import time, so the floor is the protobuf that
    # generated them (6.31.1) rather than merely "some protobuf".
    "protobuf>=6.31.1,<7",
    "aio-pika==9.6.*",
    "pydantic>=2",
    "PyJWT>=2.13",
]

[project.optional-dependencies]
fastapi = ["fastapi"]
django = ["django"]
# D1/J5: `pip install axiam-sdk[speed]` swaps CPython's stdlib event loop for
# uvloop. Measured on the benchmark harness' `check_access` path against a
# zero-work server at 16 in-flight calls: client CPU 2 182 -> 1 735 us/call
# (-20%), p95 68 -> 55 ms, throughput +7%. It changes no SDK behaviour — the
# application still chooses the loop (see docs/performance.md) — so it is an
# extra rather than a dependency, and it is Linux/macOS only.
speed = ["uvloop>=0.19; sys_platform != 'win32'"]
# CONTRACT.md §23 (OPAQUE, RFC 9807) has NO extra here, deliberately. The
# client half is `libaxiam_opaque_ffi`, a Rust cdylib published as a per-platform
# GitHub release asset of ilpanich/axiam — not a PyPI distribution — so there is
# nothing an extra could resolve. `pip install axiam-sdk[opaque]` would be a
# name that installs nothing while reading as though it installed the thing.
# Availability is reported by `AxiamClient.opaque_available()`, and the absent
# case raises NetworkError naming the artifact and AXIAM_OPAQUE_LIBRARY.
#
# The `srp` extra (argon2-cffi) that stood here was removed with SRP itself:
# `_opaque.py` contains no cryptography, so the SDK derives nothing and needs no
# KSF of its own.
dev = [
    "grpcio-tools>=1.78,<1.84",
    "mypy",
    "ruff>=0.16.0,<0.17.0",
    "interrogate",
    "build",
    "twine",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
]

[project.urls]
Repository = "https://github.com/ilpanich/axiam-python-sdk"
Documentation = "https://ilpanich.github.io/axiam-python-sdk/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiam_sdk = ["py.typed", "grpc/gen/*.py", "grpc/gen/*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# grpc/gen is protoc output — already excluded from ruff (extend-exclude) and
# mypy (exclude) below. Measuring generated stubs dilutes the ratio without
# saying anything about the SDK's own tests.
omit = ["*/grpc/gen/*"]

[tool.coverage.report]
# Regression gate: fail if coverage drops below the floor. `precision` is not
# cosmetic here — coverage.py's actual pass/fail decision
# (coverage.results.should_fail_under, which pytest-cov calls from
# pytest_runtestloop to set session.testsfailed) compares round(total,
# precision) against fail_under, while the human-readable banner pytest-cov
# prints in pytest_terminal_summary compares the raw, unrounded total. Leaving
# precision at its default of 0 makes those two comparisons disagree: any
# total in [fail_under - 0.5, fail_under) rounds UP to fail_under and clears
# the gate silently, even though the printed message still says "FAIL ...
# not reached". This repo's own history hit exactly that: commit 34bcea3
# measured 96.93% against fail_under=97, the "Run tests with coverage" CI
# step printed "FAIL Required test coverage of 97.0% not reached. Total
# coverage: 96.93%", and the step (and the whole "Coverage" workflow run)
# still reported success, because round(96.93, 0) == 97.0 and 97.0 < 97 is
# False. precision = 2 makes the printed message and the real gate decision
# agree, so "FAIL" in the log always means a failing exit code.
#
# Floor set below the current measured level (97.33% on main as of
# 2026-08-15, generated stubs excluded per [tool.coverage.run] above) so it
# never false-fails; ratchet upward as coverage rises.
fail_under = 97
precision = 2

[tool.mypy]
strict = true
files = ["src"]

# Generated gRPC stubs (D-04, "DO NOT EDIT!" header) are out of every
# plan's file-modification scope and grpc_tools.protoc does not emit a
# fully-typed _grpc.py counterpart to its .pyi message stubs — exempt the
# generated package from --strict so downstream typed modules (e.g.
# grpc/client.py, 19-04) that import it are not blocked by upstream
# codegen gaps outside this SDK's control.
[[tool.mypy.overrides]]
module = "axiam_sdk.grpc.gen.*"
ignore_errors = true

# Django ships no py.typed marker / inline type stubs (django-stubs is a
# separate, heavier package requiring its own mypy plugin configuration,
# out of this plan's scope). Suppress the resulting import-untyped
# diagnostic for axiam_sdk.django.middleware's Django imports only —
# app code that does not import Django is unaffected.
[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

# grpcio ships no py.typed marker / inline type stubs (the third-party
# `types-grpcio` package is incomplete for grpc.aio and would introduce its
# own strict-mode gaps). Suppress import-untyped for the grpc runtime imports
# in the gRPC client/interceptor/TLS modules — the SDK's own code around them
# stays fully typed.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# With grpc untyped (above), grpc.UnaryUnaryClientInterceptor /
# grpc.aio.UnaryUnaryClientInterceptor resolve to Any; the two concrete
# interceptor classes must subclass them. Permit subclassing-Any for this
# module only (the base classes are external, not ours to type).
[[tool.mypy.overrides]]
module = "axiam_sdk.grpc._interceptor"
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated gRPC stubs (D-04, "DO NOT EDIT!" header) are out of every plan's
# file-modification scope, same rationale as the [[tool.mypy.overrides]]
# exemption for axiam_sdk.grpc.gen.* above — grpc_tools.protoc's own
# codegen output predates ruff's modern style conventions (e.g. explicit
# `object` base classes) and is not something this SDK's own lint gate
# should enforce on upstream-generated code.
extend-exclude = ["src/axiam_sdk/grpc/gen"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.interrogate]
fail-under = 100
verbose = 2
# Generated gRPC stubs (D-04, "DO NOT EDIT!" header) are out of every plan's
# file-modification scope, same rationale as the [tool.ruff] extend-exclude
# and [[tool.mypy.overrides]] exemptions for axiam_sdk.grpc.gen.* above —
# grpc_tools.protoc's own codegen output is not something this SDK's own
# docstring-coverage gate should enforce on upstream-generated code.
exclude = ["src/axiam_sdk/grpc/gen", "build"]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
