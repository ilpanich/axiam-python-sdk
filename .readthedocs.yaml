# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx.
#
# `fail_on_warning` is NOT set, and that is deliberate rather than lax.
# autodoc's characteristic failure is silence, not an error — a module it
# cannot import becomes an empty page while the build stays green — but making
# every warning fatal is a blunt way to catch it, and it fails on cosmetic
# duplicate-description warnings that have no supported suppression key.
# `docs/conf.py` asserts every public module imports before the build starts,
# which targets that failure directly and reports the real ImportError.
sphinx:
  configuration: docs/conf.py

# Declare the requirements for the docs build.
#
# Installing the SDK itself (the second entry) is REQUIRED, not a nicety:
# autodoc documents by importing, so without `axiam_sdk` and its runtime
# dependencies present, every `automodule` silently renders nothing.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        # The framework integrations are separate modules in the public API
        # surface, so they need their optional dependencies importable or
        # their pages come out empty.
        - fastapi
        - django
